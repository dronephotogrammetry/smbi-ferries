name: Weekly SMBI Timetable Update

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # <-- Node 24 Future-Proofing

      - name: Download latest GTFS zip
        run: |
          echo "Downloading SEQ GTFS data..."
          curl -o gtfs.zip https://gtfsrt.api.translink.com.au/GTFS/SEQ_GTFS.zip
          echo "Unzipping data..."
          unzip -o gtfs.zip -d gtfs_data
          rm gtfs.zip 

      - name: Run Data Cruncher
        run: |
          npm install csv-parser # <-- Fixed!
          node build-timetable.js

      - name: Commit Updated Timetables
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update: Weekly SMBI GTFS Timetable"
          file_pattern: "*.json"
